
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Montserrat:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .wrap {
    background: #F7F6F2;
    min-height: 520px;
    padding: 2.5rem 2rem 3rem;
    font-family: 'Montserrat', sans-serif;
    color: #1D1311;
  }
  .headline {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: 24px;
    color: #1D1311;
    text-align: center;
    letter-spacing: 0.02em;
    margin-bottom: 0.2rem;
  }
  .subline {
    font-size: 12px;
    color: #B8A050;
    text-align: center;
    margin-bottom: 2rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .columns {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 0 1.5rem;
    align-items: start;
  }
  .col-divider {
    background: rgba(184,160,80,0.25);
    align-self: stretch;
    margin-top: 0.5rem;
  }
  .col-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #B8A050;
    margin-bottom: 1rem;
    font-weight: 500;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .input-row input {
    flex: 1;
    background: #fff;
    border: 0.5px solid rgba(184,160,80,0.5);
    border-radius: 6px;
    padding: 9px 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    color: #1D1311;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-row input::placeholder { color: rgba(29,19,17,0.35); }
  .input-row input:focus { border-color: #B8A050; }
  .btn-add {
    background: rgba(184,160,80,0.1);
    border: 0.5px solid #B8A050;
    border-radius: 6px;
    color: #8C6E1A;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 9px 16px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-add:hover { background: rgba(184,160,80,0.22); }
  .count-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.6rem;
  }
  .count-label {
    font-size: 11px;
    color: rgba(29,19,17,0.4);
    letter-spacing: 0.04em;
  }
  .btn-clear {
    background: none;
    border: none;
    color: rgba(184,160,80,0.6);
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.04em;
    padding: 0;
    transition: color 0.2s;
  }
  .btn-clear:hover { color: #8C6E1A; }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    min-height: 32px;
  }
  .tag {
    background: rgba(184,160,80,0.1);
    border: 0.5px solid rgba(184,160,80,0.4);
    border-radius: 100px;
    padding: 5px 12px;
    font-size: 11px;
    color: #1D1311;
    display: flex;
    align-items: center;
    gap: 7px;
    letter-spacing: 0.03em;
    animation: popIn 0.18s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .tag-remove {
    background: none;
    border: none;
    color: rgba(29,19,17,0.3);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    transition: color 0.15s;
  }
  .tag-remove:hover { color: #B8A050; }
  .empty-hint {
    font-size: 11px;
    color: rgba(29,19,17,0.28);
    font-style: italic;
  }
  .right-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-left: 0.5rem;
  }
  .btn-spin {
    width: 100%;
    background: #203226;
    border: none;
    border-radius: 8px;
    color: #F7F6F2;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    padding: 13px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s;
    margin-bottom: 2rem;
  }
  .btn-spin:hover { background: #2e4736; }
  .btn-spin:disabled { opacity: 0.35; cursor: default; }
  .result-area {
    text-align: center;
    width: 100%;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .result-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: #B8A050;
    text-transform: uppercase;
    margin-bottom: 1rem;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .result-word {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: 38px;
    color: #1D1311;
    letter-spacing: 0.01em;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    word-break: break-word;
    line-height: 1.2;
  }
  .result-idle {
    font-size: 12px;
    color: rgba(29,19,17,0.28);
    font-style: italic;
    text-align: center;
    line-height: 1.6;
  }
  .result-area.revealed .result-label,
  .result-area.revealed .result-word { opacity: 1; transform: translateY(0); }
  .result-sub {
    font-size: 11px;
    color: rgba(29,19,17,0.38);
    margin-top: 1.25rem;
    letter-spacing: 0.04em;
    opacity: 0;
    transition: opacity 0.6s 0.3s;
    text-align: center;
    line-height: 1.6;
  }
  .result-area.revealed .result-sub { opacity: 1; }
  .col-right-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #B8A050;
    margin-bottom: 1rem;
    font-weight: 500;
    align-self: flex-start;
  }
</style>

<div class="wrap">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">To-Be List Randomizer</h2>
  <p class="headline">Today, I Am...</p>
  <p class="subline">Add the qualities you wish to embody</p>

  <div class="columns">

    <div class="left-col">
      <p class="col-label">Your qualities</p>
      <div class="input-row">
        <input type="text" id="wordInput" placeholder="e.g. Radiant, Grounded..." maxlength="40" />
        <button class="btn-add" onclick="addWord()">+ Add</button>
      </div>
      <div class="count-bar">
        <span class="count-label" id="countLabel">0 qualities added</span>
        <button class="btn-clear" onclick="clearAll()">Clear all</button>
      </div>
      <div class="tags" id="tagContainer">
        <span class="empty-hint">Your qualities will appear here...</span>
      </div>
    </div>

    <div class="col-divider"></div>

    <div class="right-col">
      <p class="col-right-label">Today's being</p>
      <button class="btn-spin" id="spinBtn" onclick="spin()" disabled>✦ Choose for Me ✦</button>
      <div class="result-area" id="resultArea">
        <p class="result-idle" id="idleMsg">Add your qualities on the left,<br>then press the button above.</p>
        <p class="result-label" id="resultLabel">Today you are called to be</p>
        <p class="result-word" id="resultWord"></p>
        <p class="result-sub" id="resultSub"></p>
      </div>
    </div>

  </div>
</div>

<script>
  let words = [];
  const input = document.getElementById('wordInput');
  const tagContainer = document.getElementById('tagContainer');
  const spinBtn = document.getElementById('spinBtn');
  const resultArea = document.getElementById('resultArea');
  const resultWord = document.getElementById('resultWord');
  const resultSub = document.getElementById('resultSub');
  const resultLabel = document.getElementById('resultLabel');
  const countLabel = document.getElementById('countLabel');
  const idleMsg = document.getElementById('idleMsg');

  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') addWord(); });

  function addWord() {
    const raw = input.value.trim();
    if (!raw) return;
    const word = raw.charAt(0).toUpperCase() + raw.slice(1);
    if (words.includes(word)) { input.value = ''; return; }
    words.push(word);
    input.value = '';
    renderTags();
    updateCount();
    spinBtn.disabled = false;
  }

  function removeWord(index) {
    words.splice(index, 1);
    renderTags();
    updateCount();
    if (words.length === 0) {
      spinBtn.disabled = true;
      resultArea.classList.remove('revealed');
      idleMsg.style.display = '';
      resultLabel.style.display = 'none';
      resultWord.textContent = '';
      resultSub.textContent = '';
    }
  }

  function renderTags() {
    tagContainer.innerHTML = '';
    if (words.length === 0) {
      tagContainer.innerHTML = '<span class="empty-hint">Your qualities will appear here...</span>';
      return;
    }
    words.forEach(function(w, i) {
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.innerHTML = w + '<button class="tag-remove" onclick="removeWord(' + i + ')" aria-label="Remove ' + w + '">×</button>';
      tagContainer.appendChild(tag);
    });
  }

  function updateCount() {
    const n = words.length;
    countLabel.textContent = n === 0 ? '0 qualities added' : n === 1 ? '1 quality added' : n + ' qualities added';
  }

  function spin() {
    if (words.length === 0) return;
    resultArea.classList.remove('revealed');
    idleMsg.style.display = 'none';
    resultLabel.style.display = '';
    resultWord.textContent = '';
    resultSub.textContent = '';

    let ticks = 0;
    const maxTicks = 16;
    const interval = setInterval(function() {
      const rand = words[Math.floor(Math.random() * words.length)];
      resultWord.style.opacity = '0.25';
      resultWord.textContent = rand;
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(interval);
        const chosen = words[Math.floor(Math.random() * words.length)];
        resultWord.textContent = chosen;
        resultWord.style.opacity = '';
        resultSub.textContent = 'Spin again anytime — or keep adding more qualities.';
        resultArea.classList.add('revealed');
      }
    }, 75);
  }

  function clearAll() {
    if (words.length === 0) return;
    words = [];
    renderTags();
    updateCount();
    spinBtn.disabled = true;
    resultArea.classList.remove('revealed');
    idleMsg.style.display = '';
    resultLabel.style.display = 'none';
    resultWord.textContent = '';
    resultSub.textContent = '';
  }

  resultLabel.style.display = 'none';
</script>
